services:
  - type: web
    name: lf-orderbook
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_BUY_THRESHOLD
        value: "400"
      - key: TELEGRAM_SELL_THRESHOLD
        value: "400"
      - key: GATE_TESTNET_API_KEY
        sync: false
      - key: GATE_TESTNET_API_SECRET
        sync: false
      - key: LIQUIDITY_TESTNET_PIN
        sync: false
